<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>UDOO · demo sobre cartografía real (prueba)</title>
<link rel="stylesheet" href="../assets/vendor/leaflet/leaflet.css"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/udoo/udoo-mapa.css"></head>
<body><main class="container" style="padding-block:40px"><p style="margin-bottom:16px;color:var(--color-muted)">Prueba interna · demo de UDOO sobre mapa real (OpenStreetMap). Datos ficticios.</p><div class="ud" id="ud" data-start="mapa">
  <div class="ud-top">
    <div class="ud-title">UDOO · Panel de operaciones</div>
    <div class="ud-tabs" role="tablist" aria-label="Vistas de UDOO">
      <button type="button" role="tab" data-v="mapa" aria-selected="true">Mapa</button>
      <button type="button" role="tab" data-v="flota" aria-selected="false">Flota</button>
      <button type="button" role="tab" data-v="ind" aria-selected="false">Indicadores</button>
    </div>
    <span class="ud-demo">Datos de demostración</span>
  </div>
  <div class="ud-body">
    <div class="ud-map"><div id="ud-map" role="region" aria-label="Mapa de demostración sobre el parque del Retiro, con zonas, avisos y vehículos ficticios"></div></div>
    <aside class="ud-side">
      <div class="ud-kpis">
        <div class="ud-kpi new"><b data-k="open">0</b><span>Avisos abiertos</span></div>
        <div class="ud-kpi ok"><b data-k="solved">0</b><span>Resueltos hoy</span></div>
        <div class="ud-kpi"><b data-k="fleet">0</b><span>Vehículos en su sector</span></div>
        <div class="ud-kpi"><b data-k="cov">0</b><span>Cobertura de barrido</span></div>
      </div>
      <p class="ud-feed-h">Actividad reciente</p>
      <ul class="ud-feed" aria-live="off"></ul>
      <div class="ud-layers">
        <label><input type="checkbox" value="zones" checked>Zonas</label>
        <label><input type="checkbox" value="pins" checked>Avisos</label>
        <label><input type="checkbox" value="veh" checked>Vehículos</label>
      </div>
    </aside>
  </div>
  <div class="ud-panel" hidden>
    <div><h4>Avisos por zona</h4><div class="ud-bars"></div></div>
    <div><h4>Cobertura de barrido por sector</h4><div class="ud-bars ud-cov"></div></div>
  </div>
</div></main><script src="../assets/vendor/leaflet/leaflet.js"></script><script src="../assets/udoo/udoo-mapa-datos.js"></script><script src="../assets/udoo/udoo-mapa.js"></script></body></html>
