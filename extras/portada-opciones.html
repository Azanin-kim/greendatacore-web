<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portada animada GreenDataCore</title>
<style>
/* VOICE  sobrio y tecnológico, como la marca
   IDEA   el árbol del logotipo como circuito vivo: el dato sube por el tronco y enciende las hojas
   PICTURE el logotipo vertical a gran tamaño, animado, sobre grafito
   COLOUR grafito #1F1F1F, verde hoja #80CC28, pistas #3DA35D, amarillo señal #F5F547 solo en los pulsos
   TYPE   Instrument Sans
   LAYOUT pestañas arriba, escenario a pantalla completa, nota de cada opción debajo */
@font-face{font-family:"Instrument Sans";src:url(../assets/fonts/InstrumentSans-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Instrument Sans";src:url(../assets/fonts/InstrumentSans-600.woff2) format("woff2");font-weight:600}
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:#1F1F1F;color:#F4F6F3;font:16px/1.55 "Instrument Sans","Open Sans",Arial,sans-serif}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:16px max(4vw,16px);border-bottom:1px solid #333}
.bar h1{font-size:18px;font-weight:600;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:600 15px/1 inherit;font-family:inherit;color:#F4F6F3;background:#2A2A2A;border:1px solid #3E3E3E;border-radius:999px;padding:12px 18px;cursor:pointer;min-height:44px}
.tabs button[aria-selected=true]{background:#80CC28;color:#17241C;border-color:#80CC28}
.tabs button:focus-visible,.replay:focus-visible{outline:3px solid #F5F547;outline-offset:2px}
.stage{position:relative;min-height:min(78vh,720px);display:grid;place-items:center;overflow:hidden;padding:32px 16px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;transition:transform .6s ease-out}
.logo{width:min(660px,88vw,92vh);height:auto;overflow:visible}
.lema{font-size:clamp(18px,2.2vw,26px);color:#F4F6F3;margin:0;text-align:center}
.note{max-width:820px;margin:0 auto;padding:8px max(4vw,16px) 40px;display:grid;gap:6px}
.note h2{font-size:20px;margin:0;font-weight:600;color:#80CC28}
.note p{margin:0;color:#BFC7C1}
.replay{justify-self:start;margin-top:8px;font:600 15px/1 inherit;font-family:inherit;background:transparent;color:#F4F6F3;border:1px solid #777;border-radius:8px;padding:12px 16px;cursor:pointer}
.sway{transform-box:view-box;animation:sway var(--d,5s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes sway{from{transform:rotate(calc(var(--a,3deg) * -1))}to{transform:rotate(var(--a,3deg))}}
.breathe{animation:breathe 3.6s ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes breathe{from{opacity:.78}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sway,.breathe{animation:none}}
</style>
</head>

  <h1>Portada animada · tres propuestas</h1>

    <button role="tab" id="t-b" aria-selected="false" data-m="b">B · El árbol crece</button>
    <button role="tab" id="t-c" aria-selected="false" data-m="c">C · Ecosistema vivo</button>
  </div>
</div>

<script>
{
const TREE_HTML = document.getElementById('tree').innerHTML;
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NOTES = {
  a: ['A · Flujo de datos', 'Pulsos de datos suben sin parar desde la raíz por el tronco y las ramas. Cada pulso enciende su hoja al llegar; las hojas se mecen suavemente. Es la opción más limpia y la que mejor transmite «el dato recorre el sistema».'],
  b: ['B · El árbol crece', 'Al entrar en la web, el árbol se dibuja desde la raíz: crecen las pistas, aparecen los nodos y brotan las hojas de abajo arriba; al final aparece el nombre. Después queda vivo con pulsos ocasionales. Es la más narrativa y solo se reproduce una vez por visita.'],
  c: ['C · Ecosistema vivo', 'El flujo de datos de la opción A más un fondo de circuito con partículas que ascienden, hojas que respiran y un ligero movimiento del árbol al mover el ratón. Es la más inmersiva y tecnológica, con más carga visual.']
};
let timers = [], raf = 0, stopFns = [];
const clearAll = () => { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); stopFns.forEach(f => f()); stopFns = []; };
const later = (f, ms) => timers.push(setTimeout(f, ms));

function parsePts(d){ return d.replace(/[ML]/g,' ').trim().split(/\s+/).map(Number).reduce((a,v,i,arr)=>{ if(i%2===0) a.push([v,arr[i+1]]); return a; },[]); }
const dist = (a,b) => Math.hypot(a[0]-b[0],a[1]-b[1]);
function onSeg(p,a,b){ const L=dist(a,b), d1=dist(a,p), d2=dist(p,b); return Math.abs(d1+d2-L) < 0.6; }

function setup(){
  const host = document.getElementById('tree');
  host.innerHTML = TREE_HTML;
  const inner = host.querySelector('svg svg');
  const leaves = [...inner.querySelectorAll('path[fill="#80CC28"]')];
  const all = [...inner.querySelectorAll('path[stroke]')];
  const mains = all.filter(p => p.getAttribute('fill') === 'none').map(p => ({el:p, pts:parsePts(p.getAttribute('d'))}));
  const twigs = all.filter(p => p.getAttribute('fill') !== 'none').map(p => ({el:p, pts:parsePts(p.getAttribute('d'))}));
  const nodes = [...inner.querySelectorAll('circle')];
  const base = inner.querySelector('rect');
  const pulses = document.createElementNS(NS,'g'); inner.appendChild(pulses);
  const items = leaves.map(leaf => {
    const m = leaf.getAttribute('transform').match(/translate\(([-\d.]+) ([-\d.]+)\)/);
    const pos = [+m[1], +m[2]];
    const g = document.createElementNS(NS,'g');
    g.setAttribute('class','sway');
    g.style.transformOrigin = pos[0]+'px '+pos[1]+'px';
    g.style.setProperty('--d', (4 + Math.random()*3).toFixed(2)+'s');
    g.style.setProperty('--dl', (-Math.random()*6).toFixed(2)+'s');
    g.style.setProperty('--a', (2 + Math.random()*3).toFixed(1)+'deg');
    leaf.parentNode.insertBefore(g, leaf); g.appendChild(leaf);
    let best = null, bd = 1e9;
    mains.forEach(mn => { const t = mn.pts[mn.pts.length-1]; const dd = dist(t,pos); if (dd < bd) { bd = dd; best = {type:'main', mn}; } });
    twigs.forEach(tw => { const t = tw.pts[tw.pts.length-1]; const dd = dist(t,pos); if (dd < bd) { bd = dd; best = {type:'twig', tw}; } });
    let route;
    if (best.type === 'main') route = best.mn.pts;
    else {
      const j = best.tw.pts[0]; route = null;
      for (const mn of mains) { const P = mn.pts; for (let i=0;i<P.length-1;i++) if (onSeg(j,P[i],P[i+1])) { route = P.slice(0,i+1).concat([j, best.tw.pts[1]]); break; } if (route) break; }
      if (!route) route = best.tw.pts;
    }
    const d = 'M' + route.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
    let len = 0; for (let i=0;i<route.length-1;i++) len += dist(route[i],route[i+1]);
    const node = nodes.reduce((a,n) => { const dd = dist([+n.getAttribute('cx'),+n.getAttribute('cy')], route[route.length-1]); return dd < a[1] ? [n,dd] : a; }, [null,1e9])[0];
    return {leaf, g, d, len, node, tipY: pos[1]};
  });
  return {inner, items, mains, twigs, nodes, base, pulses};
}

function pulse(T, it, opts={}){
  const speed = opts.speed || 260;
  const dur = it.len / speed * 1000;
  const seg = 34;
  const mk = (w, c, o) => { const p = document.createElementNS(NS,'path'); p.setAttribute('d', it.d); p.setAttribute('fill','none'); p.setAttribute('stroke', c); p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round'); p.setAttribute('opacity', o); p.style.strokeDasharray = seg+' '+(it.len+seg*2); T.pulses.appendChild(p); return p; };
  const halo = mk(9, '#F5F547', .18), core = mk(3.4, '#F5F547', 1);
  const kf = [{strokeDashoffset: seg}, {strokeDashoffset: -it.len}];
  [halo, core].forEach(p => p.animate(kf, {duration: dur, easing: 'cubic-bezier(.45,.05,.55,.95)'}));
  later(() => { halo.remove(); core.remove(); light(it); }, dur - 60);
}
function light(it){
  it.leaf.animate([{fill:'#80CC28'},{fill:'#E8FF7A', offset:.25},{fill:'#80CC28'}], {duration: 1100, easing:'ease-out'});
  it.g.animate([{scale:'1'},{scale:'1.18', offset:.3},{scale:'1'}], {duration: 900, easing:'ease-out'});
  if (it.node) it.node.animate([{fill:'#80CC28'},{fill:'#F5F547', offset:.2},{fill:'#80CC28'}], {duration: 900});
}
function stream(T, every, opts){
  let alive = true; stopFns.push(() => alive = false);
  const tick = () => { if (!alive) return; const it = T.items[Math.floor(Math.random()*T.items.length)]; pulse(T, it, opts); later(tick, every*(0.6+Math.random()*0.8)); };
  tick();
}

function modeA(){ const T = setup(); if (reduce) return; stream(T, 420); }

function modeB(){
  const T = setup(); const lema = document.getElementById('lema');
  if (reduce) return;
  const txt = [...document.querySelectorAll('#tree > svg > path')];
  txt.forEach(p => p.style.opacity = 0); lema.style.opacity = 0;
  T.items.forEach(it => { it.g.style.opacity = 0; });
  T.nodes.forEach(n => n.style.opacity = 0);
  const grow = (el, delay, dur) => { const L = el.getTotalLength(); el.style.strokeDasharray = L; el.style.strokeDashoffset = L; el.animate([{strokeDashoffset:L},{strokeDashoffset:0}], {duration:dur, delay, fill:'forwards', easing:'cubic-bezier(.3,.1,.3,1)'}); };
  T.base.animate([{opacity:0},{opacity:1}], {duration:500, fill:'forwards'});
  T.mains.forEach(m => grow(m.el, 350, 1900));
  T.twigs.forEach(t => grow(t.el, 1300 + Math.random()*500, 600));
  T.nodes.forEach(n => n.animate([{opacity:0},{opacity:1}], {duration:400, delay: 1900 + Math.random()*400, fill:'forwards'}));
  const sorted = [...T.items].sort((a,b) => b.tipY - a.tipY);
  sorted.forEach((it, i) => it.g.animate([{opacity:0, scale:'0'},{opacity:1, scale:'1.25', offset:.6},{opacity:1, scale:'1'}], {duration:650, delay: 1700 + i*55, fill:'forwards', easing:'cubic-bezier(.3,1.4,.5,1)'}));
  const tEnd = 1700 + sorted.length*55 + 400;
  txt.forEach((p,i) => p.animate([{opacity:0},{opacity:1}], {duration:700, delay: tEnd + i*20, fill:'forwards'}));
  lema.animate([{opacity:0, transform:'translateY(10px)'},{opacity:1, transform:'none'}], {duration:700, delay: tEnd + 500, fill:'forwards'});
  later(() => stream(T, 1500, {speed:220}), tEnd + 800);
}

function modeC(){
  const T = setup(); const hero = document.getElementById('hero'); const stage = document.getElementById('stage');
  T.items.forEach(it => { it.leaf.classList.add('breathe'); it.leaf.style.setProperty('--dl', (-Math.random()*4).toFixed(2)+'s'); });
  if (reduce) return;
  stream(T, 300, {speed:300});
  const cv = document.getElementById('bg'); const ctx = cv.getContext('2d');
  let W, H, parts = [], grid = [];
  const size = () => { const r = stage.getBoundingClientRect(); W = cv.width = r.width * devicePixelRatio; H = cv.height = r.height * devicePixelRatio; grid = []; const s = 56*devicePixelRatio; for (let x = s/2; x < W; x += s) for (let y = s/2; y < H; y += s) if (Math.random() < .35) grid.push([x,y, Math.random()]); };
  const ro = new ResizeObserver(size); ro.observe(stage); stopFns.push(() => { ro.disconnect(); ctx.clearRect(0,0,W,H); });
  const spawn = () => parts.push({x: W*(0.2+Math.random()*0.6), y: H + 10, v: (0.4+Math.random()*0.9)*devicePixelRatio, r: (1+Math.random()*1.8)*devicePixelRatio, a: 0});
  const loop = t => {
    ctx.clearRect(0,0,W,H);
    grid.forEach(([x,y,p]) => { const a = 0.08 + 0.07*Math.sin(t/1400 + p*6.28); ctx.fillStyle = 'rgba(61,163,93,'+a+')'; ctx.fillRect(x-1.5,y-1.5,3,3); if (p > .7) { ctx.strokeStyle = 'rgba(61,163,93,'+(a*.8)+')'; ctx.lineWidth = devicePixelRatio; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+28*devicePixelRatio, y-28*devicePixelRatio); ctx.stroke(); } });
    if (Math.random() < .35) spawn();
    parts = parts.filter(p => p.y > -10);
    parts.forEach(p => { p.y -= p.v; p.a = Math.min(1, p.a + .02); const fade = Math.min(1, p.y / (H*.5)); ctx.fillStyle = 'rgba(128,204,40,'+(0.55*p.a*fade)+')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); });
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  const mv = e => { const r = stage.getBoundingClientRect(); const dx = (e.clientX - r.left)/r.width - .5, dy = (e.clientY - r.top)/r.height - .5; hero.style.transform = 'translate('+(dx*14).toFixed(1)+'px,'+(dy*10).toFixed(1)+'px)'; };
  stage.addEventListener('pointermove', mv); stopFns.push(() => { stage.removeEventListener('pointermove', mv); hero.style.transform = ''; });
}

const MODES = {a: modeA, b: modeB, c: modeC};
function show(m){
  clearAll();
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.m === m)));
  const lema = document.getElementById('lema'); lema.getAnimations().forEach(a => a.cancel()); lema.style.opacity = '';
  const note = document.getElementById('note'); const [h, p] = NOTES[m];
  note.innerHTML = '';
  const H2 = document.createElement('h2'); H2.textContent = h; const P = document.createElement('p'); P.textContent = p; note.append(H2, P);
  if (m === 'b') { const r = document.createElement('button'); r.className = 'replay'; r.type = 'button'; r.textContent = 'Repetir la animación'; r.addEventListener('click', () => show('b')); note.append(r); }
  MODES[m]();
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.m)));
document.querySelector('.tabs').addEventListener('keydown', e => { const order = ['a','b','c']; const cur = order.indexOf(document.querySelector('.tabs [aria-selected=true]').dataset.m); if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = order[(cur + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; show(n); document.querySelector('.tabs [data-m="'+n+'"]').focus(); } });
show('a');
}
</script>
